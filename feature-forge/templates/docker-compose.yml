# Local infra for feature-forge: MongoDB (replica set) + MinIO (S3) + bucket init.
# Adapt service names/ports/creds to MATCH the backend's existing config before using.
# Bring up: docker compose up -d   ·   run app cmds inside the network: docker compose exec <app> ...

services:
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]   # replica set → enables transactions
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: initialize the replica set once mongo is reachable.
  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try { rs.status() } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })
          }'

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the app bucket(s) and set policy.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}"; do sleep 2; done
        mc mb -p local/${APP_BUCKET:-app-bucket} || true
        mc anonymous set download local/${APP_BUCKET:-app-bucket} || true

  # --- Greenfield only: add your app services here, pointing at mongodb + minio ---
  # api:
  #   build: ./api
  #   depends_on: { mongodb: { condition: service_healthy }, minio: { condition: service_started } }
  #   environment:
  #     DB_HOST: mongodb
  #     DB_PORT: "27017"
  #     AWS_ENDPOINT: http://minio:9000
  #     AWS_USE_PATH_STYLE_ENDPOINT: "true"
  #     AWS_BUCKET: ${APP_BUCKET:-app-bucket}

volumes:
  mongo_data:
  minio_data:
